<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Project Seven</title>
    <style>
        html, body {
            background: #141615;
        }

        #name-form {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-sizing: border-box;
            width: min(380px, calc(100vw - 32px));
            padding: 36px;
            background: #171918;
            border: 1px solid #2a2e2c;
            border-radius: 20px;
            z-index: 2000;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            color: #ece8de;
        }

        #name-form p {
            margin: 0 0 24px 0;
            font-size: 22px;
            font-weight: 600;
        }

        #name-form label {
            display: block;
            margin: 0 0 8px 0;
            font-size: 12px;
            font-weight: 600;
            color: #8d928f;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        #name-text-input {
            width: 100%;
            box-sizing: border-box;
            height: 46px;
            padding: 0 16px;
            margin-bottom: 20px;
            background: #141615;
            border: 1px solid #2a2e2c;
            border-radius: 14px;
            color: #ece8de;
            font: inherit;
            font-size: 15px;
            transition: border-color 0.15s;
        }

        #name-text-input::placeholder {
            color: #8d928f;
        }

        #name-text-input:focus {
            outline: none;
            border-color: #a3dcb8;
        }

        #name-form button {
            width: 100%;
            height: 46px;
            background: #a3dcb8;
            color: #12261b;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            transition: background-color 0.15s;
        }

        #name-form button:hover {
            background: #b6e8c8;
        }
    </style>
</head>
<body style="margin: 0;">
    <div id="game"></div>

    <div id="name-form">
        <p>Connect to Server</p>
        
        <label for="name-text-input">Username:</label>
        <input id="name-text-input" value="" placeholder="Enter your username" />

        <button onclick="onStartGameClicked();">
            Enter Lobby
        </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
