<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Project Seven</title>
    <style>
        html, body {
            background: #141615;
        }

        #name-form {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-sizing: border-box;
            width: min(380px, calc(100vw - 32px));
            padding: 36px;
            background: #171918;
            border: 1px solid #2a2e2c;
            border-radius: 20px;
            z-index: 2000;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            color: #ece8de;
        }

        #name-form p {
            margin: 0 0 24px 0;
            font-size: 22px;
            font-weight: 600;
        }

        #name-form label {
            display: block;
            margin: 0 0 8px 0;
            font-size: 12px;
            font-weight: 600;
            color: #8d928f;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        #name-form input {
            width: 100%;
            box-sizing: border-box;
            height: 46px;
            padding: 0 16px;
            margin-bottom: 20px;
            background: #141615;
            border: 1px solid #2a2e2c;
            border-radius: 14px;
            color: #ece8de;
            font: inherit;
            font-size: 15px;
            transition: border-color 0.15s;
        }

        #name-form input::placeholder {
            color: #8d928f;
        }

        #name-form input:focus {
            outline: none;
            border-color: #a3dcb8;
        }

        #name-form button {
            width: 100%;
            height: 46px;
            background: #a3dcb8;
            color: #12261b;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            transition: background-color 0.15s;
        }

        #name-form button:hover {
            background: #b6e8c8;
        }

        /* Two modes: quick entry by name (guest) / logging in to a claimed account. */
        #name-form[data-mode='guest'] #login-fields,
        #name-form[data-mode='login'] #name-fields {
            display: none;
        }

        #name-form-error {
            margin: -8px 0 16px 0;
            font-size: 13px;
            color: #e58a8a;
        }

        #name-form-toggle {
            display: block;
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #8d928f;
            text-decoration: none;
        }

        #name-form-toggle:hover {
            color: #a3dcb8;
        }
    </style>
</head>
<body style="margin: 0;">
    <div id="game"></div>

    <div id="name-form" data-mode="guest">
        <p>Connect to Server</p>

        <div id="name-fields">
            <label for="name-text-input">Username:</label>
            <input id="name-text-input" value="" placeholder="Enter your username" maxlength="32" />
        </div>

        <div id="login-fields">
            <label for="login-text-input">Login:</label>
            <input id="login-text-input" value="" placeholder="Your account login" maxlength="32"
                   autocomplete="username" autocapitalize="none" spellcheck="false" />
            <label for="password-text-input">Password:</label>
            <input id="password-text-input" type="password" value="" placeholder="Password" maxlength="128"
                   autocomplete="current-password" />
        </div>

        <div id="name-form-error" hidden></div>

        <button id="name-form-submit" onclick="onStartGameClicked();">
            Enter Lobby
        </button>

        <a id="name-form-toggle" href="#">I have an account</a>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
