name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  server:
    name: Server (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WsServer/WsServer.sln

      - name: Build
        run: dotnet build WsServer/WsServer.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test WsServer/WsServer.sln --no-build --configuration Release --verbosity normal

  client:
    name: Client (typecheck, lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WsCore.Client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: WsCore.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t wscore-game-server:ci .
