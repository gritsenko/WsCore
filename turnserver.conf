# coturn — the TURN relay for voice channels (WebRTC). Peers that cannot reach each
# other directly (symmetric NAT, mobile carriers, corporate firewalls) send their audio
# through it. Started by docker-compose (profile "turn"); the shared secret comes from
# TURN_SECRET in .env (--static-auth-secret on the command line), the same value the
# game server signs time-limited credentials with (GameServer:VoiceTurnSecret).
#
# Firewall: open 3478/udp, 3478/tcp and the relay range below (udp) on the host.

listening-port=3478
# No TLS listener yet (turns:): coturn runs unprivileged and cannot read the Let's
# Encrypt key as mounted. 3478/tcp covers networks that drop UDP.
no-tls
no-dtls

# Relay ports: each relayed peer connection takes one. 200 ports = ~100 relayed calls.
min-port=49160
max-port=49360

# Behind NAT (the public IP is not on the interface)? Uncomment and set it:
# external-ip=203.0.113.10

realm=DOMAIN_PLACEHOLDER
use-auth-secret
fingerprint

# Only relay to the public internet: never into the host's own or private networks.
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse limits: a voice call needs a few; nobody needs many.
user-quota=12
total-quota=400
stale-nonce=600

no-cli
log-file=stdout
simple-log
