services:
  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-server
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      # Voice: TURN credentials for the coturn service below (empty secret = STUN only).
      - GameServer__VoiceTurnSecret=${TURN_SECRET:-}
      - GameServer__VoiceTurnUrls__0=turn:${TURN_HOST:-localhost}:3478?transport=udp
      - GameServer__VoiceTurnUrls__1=turn:${TURN_HOST:-localhost}:3478?transport=tcp
    expose:
      - "80"
    volumes:
      # Chat history + known users (SQLite). Survives rebuilds / re-creation.
      - game-data:/app/data
    networks:
      - game-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    networks:
      - game-network
    depends_on:
      - game-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TURN relay for voice channels (WebRTC). Enabled by COMPOSE_PROFILES=turn in .env,
  # with TURN_SECRET (shared with game-server above) and TURN_HOST (the public host name).
  # Host networking: it needs a public UDP port range, which bridged Docker handles badly.
  coturn:
    image: coturn/coturn:4.6.3
    container_name: coturn
    restart: unless-stopped
    profiles: ["turn"]
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_SECRET:-}"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'
    restart: unless-stopped
    networks:
      - game-network

volumes:
  game-data:

networks:
  game-network:
    driver: bridge
